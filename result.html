
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Result - Smart Quiz</title>
        <link rel="stylesheet" href="result.css">
        <link rel="stylesheet" href="logo.css">
        <script src="student-data.js"></script>
</head>
<body>

    <header class="topbar">
        <a href="dashboard.html" class="logo project-brand">
            <img src="images/logo.jpg"
                 alt="Smart Quiz Logo"
                 class="project-logo project-logo-small">
            <span>Smart Quiz</span>
        </a>
        <a href="dashboard.html" class="back-link">Back to Dashboard</a>
    </header>

    <main class="container">
        <section class="result-card">
            <div class="result-icon" id="resultIcon">✓</div>

            <p class="subtitle">QUIZ COMPLETED</p>
            <h1 id="resultHeading">Your Result</h1>
            <p class="quiz-title" id="quizTitle">Quiz</p>

            <div class="score-circle">
                <span id="percentage">0%</span>
                <small>Your Score</small>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <span>Correct</span>
                    <strong id="correctCount">0</strong>
                </div>

                <div class="stat-box">
                    <span>Incorrect</span>
                    <strong id="incorrectCount">0</strong>
                </div>

                <div class="stat-box">
                    <span>Total</span>
                    <strong id="totalCount">0</strong>
                </div>
            </div>

            <p class="feedback" id="feedback">
                Your result is ready.
            </p>

            <div class="actions">
                <a href="review.html" class="btn primary">
                    Review My Answers
                </a>

                <a href="dashboard.html" class="btn secondary">
                    Back to Dashboard
                </a>
            </div>

            <p class="note">
                Your result is saved locally for your account in this browser.
            </p>
        </section>
    </main>

    <script>
const sd=window.StudentData;
if(sd){
  const record=sd.getSelectedResult();
  const data=sd.getSelectedReview();
  if(!record){
    document.querySelector('.result-card').innerHTML='<h1>No Result Found</h1><p>Please complete a quiz first.</p><a href="results.html" class="btn primary">My Results</a>';
  }else{
    const total=Number(record.totalQuestions)||0,correct=Number(record.correctAnswers)||0,pct=Number(record.percentage)||0;
    document.getElementById('quizTitle').textContent=record.quizTitle||'Quiz';
    document.getElementById('percentage').textContent=pct+'%';
    document.getElementById('correctCount').textContent=correct;
    document.getElementById('incorrectCount').textContent=Math.max(0,total-correct);
    document.getElementById('totalCount').textContent=total;
    document.getElementById('resultHeading').textContent=pct>=80?'Excellent Work!':pct>=50?'Good Effort!':'Keep Practicing!';
    document.getElementById('resultIcon').textContent=pct>=80?'★':pct>=50?'✓':'↗';
    document.getElementById('feedback').textContent=pct>=80?'Great job!':pct>=50?'Review your answers to improve your score.':'Keep practicing and review your answers.';
    const reviewLink=document.querySelector('a[href="review.html"]');
    if(!data){reviewLink.textContent='Review unavailable for older attempt';reviewLink.removeAttribute('href');}
  }
}
</script>

</body>
</html>
