<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quiz | Available Quizzes</title>
    <link rel="stylesheet" href="quizzes.css">
    <link rel="stylesheet" href="logo.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>
    <header class="topbar">
        <a class="logo project-brand" href="dashboard.html">
            <img src="images/logo.png" alt="Smart Quiz Logo" class="project-logo project-logo-small">
            <span>Smart Quiz</span>
        </a>
        <a class="back-link" href="dashboard.html">← Back to Dashboard</a>
    </header>

    <main class="container">
        <div class="page-heading">
            <p class="subtitle">EXAMINATION PORTAL</p>
            <h1>Available Quizzes</h1>
            <p>Select an open exam to begin. Upcoming exams show a live countdown timer.</p>
        </div>

        <div class="quiz-list" id="quizzesGrid" style="display:grid;gap:16px;"></div>
    </main>

    <script src="api.js"></script>
    <script>
        (() => {
            const user = JSON.parse(sessionStorage.getItem("currentUser") || "null");
            if (!user || user.role !== "student") { window.location.replace("index.html"); return; }

            function formatCountdown(sec) {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            }

            async function loadQuizzes() {
                const grid = document.getElementById("quizzesGrid");
                try {
                    const quizzes = await apiRequest("/student/quizzes");
                    grid.replaceChildren();
                    if (!quizzes.length) { grid.innerHTML = "<p>No published quizzes available right now.</p>"; return; }

                    quizzes.forEach(q => {
                        const card = document.createElement("div");
                        card.style.cssText = "background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;";

                        const info = document.createElement("div");
                        const modeText = q.exam_mode === "sectioned" ? "Sectioned (Lectures)" : (q.exam_mode === "random_pool" ? "Randomized Pool" : "Standard");
                        info.innerHTML = `<h3 style="margin:0 0 6px;color:#0f172a;">${q.title}</h3>
                        <p style="margin:0 0 10px;color:#64748b;font-size:13px;">Course: <strong>${q.course_name}</strong> · Instructor: <strong>${q.instructor_name}</strong> · Mode: ${modeText}</p>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;">
                            <span style="background:#eff6ff;color:#2563eb;padding:4px 10px;border-radius:6px;font-weight:700;">${q.questions_count} Questions (${q.total_marks} Marks)</span>
                            <span style="background:#f0fdf4;color:#15803d;padding:4px 10px;border-radius:6px;font-weight:700;">Duration: ${q.duration_minutes} min</span>
                            <span style="background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:6px;font-weight:700;">Pass: ${q.pass_percentage}%</span>
                        </div>`;

                        const action = document.createElement("div");
                        action.style.textAlign = "right";
                        const btn = document.createElement("button");
                        btn.style.cssText = "padding:11px 18px;border:0;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;";

                        if (q.availability_status === "open") {
                            btn.style.background = "#2563eb";
                            btn.style.color = "#fff";
                            btn.textContent = "Start Quiz";
                            btn.addEventListener("click", () => {
                                sessionStorage.setItem("selectedQuizId", q.quiz_id);
                                window.location.href = "quiz.html";
                            });
                        } else if (q.availability_status === "upcoming") {
                            btn.disabled = true;
                            btn.style.background = "#e2e8f0";
                            btn.style.color = "#475569";
                            let rem = Number(q.starts_in_seconds || 0);
                            btn.textContent = "Starts in " + formatCountdown(rem);
                            const iv = setInterval(() => {
                                rem--;
                                if (rem <= 0) { clearInterval(iv); loadQuizzes(); }
                                else btn.textContent = "Starts in " + formatCountdown(rem);
                            }, 1000);
                        } else if (q.availability_status === "completed") {
                            btn.disabled = true;
                            btn.style.background = "#dcfce7";
                            btn.style.color = "#15803d";
                            btn.textContent = "Completed ✓";


                        } else {
                            btn.disabled = true;
                            btn.style.background = "#fee2e2";
                            btn.style.color = "#b91c1c";
                            btn.textContent = "Exam Closed";
                        }

                        action.appendChild(btn);
                        card.append(info, action);
                        grid.appendChild(card);
                    });
                } catch (e) { grid.innerHTML = `<p style="color:#dc2626">${e.message}</p>`; }
            }
            loadQuizzes();
        })();
    </script>
    <script src="lang.js"></script>
</body>

</html>
